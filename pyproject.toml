[project]
name = "piper-starter"
version = "0.1.0"
description = "Phase 0: AgileX Piper picks an A4 plate and places it on a gridded wall, in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.3",
    "mink>=1.0",
    "qpsolvers[daqp]>=4.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piper_starter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
